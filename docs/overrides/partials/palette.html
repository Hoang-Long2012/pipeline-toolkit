<div class="md-header__option" data-md-component="custom-palette">
  <button type="button" class="md-header__button md-icon" aria-label="Change color scheme" aria-haspopup="dialog" aria-expanded="false" aria-controls="__palette_dialog" data-palette-button>
    {% set icon = "material/brightness-7" %}
    {% include ".icons/" ~ icon ~ ".svg" %}
  </button>
  <dialog id="__palette_dialog" class="md-palette-dialog" aria-labelledby="__palette_dialog_title" data-palette-menu>
    <h2 id="__palette_dialog_title">Color scheme</h2>
    <div role="radiogroup" aria-labelledby="__palette_dialog_title">
      {% for option in config.theme.palette %}
        {% set scheme = option.scheme | d("default", true) %}
        <label>
          <input type="radio" aria-label="{{ option.toggle.name if option.toggle else scheme }}" name="color-scheme" value="{{ scheme | replace(' ', '-') }}" data-palette-option data-md-color-media="{{ option.media }}" data-md-color-scheme="{{ scheme | replace(' ', '-') }}" data-md-color-primary="{{ option.primary | d('indigo', true) | replace(' ', '-') }}" data-md-color-accent="{{ option.accent | d('indigo', true) | replace(' ', '-') }}" data-palette-index="{{ loop.index0 }}">
          {{ option.toggle.name if option.toggle else scheme }}
        </label>
      {% endfor %}
    </div>
    <button type="button" data-palette-close>Close</button>
  </dialog>
</div>
