<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b0f1d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Logo Squircle Gradient -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Main Pipeline Gradient -->
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#0ea5e9" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Core Flow Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#f5d0fe" />
    </linearGradient>

    <!-- Text Gradient for Toolkit -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Rounded Container -->
  <rect width="960" height="260" rx="28" fill="url(#bannerBg)" />
  <rect width="958" height="258" x="1" y="1" rx="27" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Subtle Decorative Grid Lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="65" x2="960" y2="65" />
    <line x1="0" y1="130" x2="960" y2="130" />
    <line x1="0" y1="195" x2="960" y2="195" />
    <line x1="320" y1="0" x2="320" y2="260" />
    <line x1="560" y1="0" x2="560" y2="260" />
    <line x1="800" y1="0" x2="800" y2="260" />
  </g>

  <!-- Left Icon Container (Offset x=30, y=30, size=200x200, scaled from 512) -->
  <g transform="translate(35, 30)">
    <!-- Squircle -->
    <rect width="200" height="200" rx="44" fill="url(#iconBg)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
    
    <!-- Scaled Icon Inner (200 / 512 = ~0.3906) -->
    <g transform="scale(0.3906)">
      <!-- Soft Glow -->
      <path d="M 151 106 L 151 406 M 151 150 L 301 150 C 361 150 361 270 301 270 L 151 270"
            fill="none" stroke="#6366f1" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"
            opacity="0.3" filter="url(#softGlow)" />

      <!-- Pipe Outer -->
      <path d="M 151 106 L 151 406 M 151 150 L 301 150 C 361 150 361 270 301 270 L 151 270"
            fill="none" stroke="#050814" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Pipe Body -->
      <path d="M 151 106 L 151 406 M 151 150 L 301 150 C 361 150 361 270 301 270 L 151 270"
            fill="none" stroke="url(#pipeGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

      <!-- High-Speed Data Stream Core -->
      <path d="M 151 116 L 151 396 M 151 150 L 301 150 C 353 150 353 270 301 270 L 151 270"
            fill="none" stroke="url(#coreGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
            opacity="0.95" />

      <!-- Flanges -->
      <rect x="127" y="92" width="48" height="14" rx="5" fill="#38bdf8" />
      <rect x="133" y="95" width="36" height="8" rx="3" fill="#ffffff" />
      <rect x="127" y="400" width="48" height="14" rx="5" fill="#c084fc" />
      <rect x="133" y="403" width="36" height="8" rx="3" fill="#ffffff" />

      <!-- Nodes -->
      <circle cx="226" cy="150" r="19" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
      <circle cx="226" cy="150" r="8" fill="#38bdf8" />
      <circle cx="226" cy="150" r="3.5" fill="#ffffff" />

      <circle cx="361" cy="210" r="21" fill="#0f172a" stroke="#818cf8" stroke-width="6.5" />
      <circle cx="361" cy="210" r="9" fill="#818cf8" />
      <circle cx="361" cy="210" r="4" fill="#ffffff" />

      <circle cx="226" cy="270" r="19" fill="#0f172a" stroke="#c084fc" stroke-width="6" />
      <circle cx="226" cy="270" r="8" fill="#c084fc" />
      <circle cx="226" cy="270" r="3.5" fill="#ffffff" />

      <circle cx="151" cy="270" r="13" fill="#6366f1" stroke="#ffffff" stroke-width="4.5" />
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(275, 0)">
    <!-- Title: Pipeline Toolkit -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="62" letter-spacing="-1">
      <tspan fill="#f8fafc">Pipeline </tspan>
      <tspan fill="url(#textGrad)">Toolkit</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#94a3b8" letter-spacing="0.2">
      Small, reusable, editable asynchronous pipelines for Python
    </text>

    <!-- Feature Badges -->
    <g transform="translate(2, 186)">
      <!-- Badge 1: Async Native -->
      <rect x="0" y="0" width="124" height="28" rx="6" fill="#1e293b" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8" />
      <text x="26" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#cbd5e1">Async Native</text>

      <!-- Badge 2: Zero Dependencies -->
      <rect x="136" y="0" width="158" height="28" rx="6" fill="#1e293b" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
      <circle cx="150" cy="14" r="4" fill="#818cf8" />
      <text x="162" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#cbd5e1">Zero Dependencies</text>

      <!-- Badge 3: Mutable & Reusable -->
      <rect x="306" y="0" width="166" height="28" rx="6" fill="#1e293b" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
      <circle cx="320" cy="14" r="4" fill="#c084fc" />
      <text x="332" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#cbd5e1">Mutable &amp; Reusable</text>
    </g>
  </g>
</svg>