[project]
name = "pipeline-toolkit"
version = "0.9.1"
description = "A small functional pipeline toolkit for Python."
readme = "README.md"

authors = [
	{ name = "Hoàng Long", email = "hoanglongcodes@gmail.com" }
]

license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"

dependencies = []

keywords = [
	"pipeline",
	"pipeline object",
	"functional programming",
	"functional pipeline",
	"functional toolkit",
	"sequence pipeline",
	"execute object",
	"executor",
	"workflow",
	"task",
	"async",
	"asynchronous",
	"threading",
	"utilities"
]

classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.8",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: 3.15",
	"Topic :: Software Development :: Libraries :: Python Modules",
	"Topic :: Utilities"
]

[project.urls]
Homepage = "https://pipeline-toolkit.pages.dev"
Repository = "https://github.com/Hoang-Long2012/pipeline-toolkit"
Documentation = "https://pipeline-toolkit.pages.dev"
Issues = "https://github.com/Hoang-Long2012/pipeline-toolkit/issues"
Discussions = "https://github.com/Hoang-Long2012/pipeline-toolkit/discussions"
Changelog = "https://pipeline-toolkit.pages.dev/changelog"
Contributing = "https://pipeline-toolkit.pages.dev/contributing"

[tool.uv]
default-groups = ["dev"]
link-mode = "copy"
trusted-publishing = "automatic"

[tool.hatch.build.targets.sdist]
exclude = ["/src/pipeline/**"]
hooks.custom.path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
hooks.custom.path = "hatch_build.py"

[tool.ruff]
src = ["src", "tests"]
indent-width = 4

[tool.ruff.lint]
ignore = ["B015", "BLE001", "RET501", "SIM102", "SIM117", "PIE810"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.src]
include = ["src"]
respect-ignore-files = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov -n auto -p no:cacheprovider"
timeout = 10
strict = true

[tool.coverage.run]
source_pkgs = ["pipeline"]
branch = true

[tool.coverage.report]
fail_under = 95
skip_covered = true
show_missing = true

[tool.coverage.html]
skip_covered = true

[tool.poe.tasks.validate-pyproject]
cmd = "validate-pyproject pyproject.toml"
help = "Validate the pyproject.toml configuration."

[tool.poe.tasks.lint]
cmd = "ruff check --no-cache"
help = "Run Ruff lint checks."

[tool.poe.tasks.fix]
cmd = "ruff check --no-cache --fix"
help = "Automatically fix linting issues."

[tool.poe.tasks.typecheck]
cmd = "ty check"
help = "Run static type checks."

[tool.poe.tasks.diff-check]
sequence = [
	{ cmd = "git diff --check" },
	{ cmd = "git diff --cached --check" },
]
help = "Check for whitespace errors in Git changes."

[tool.poe.tasks.test]
cmd = "pytest"
help = "Run the test suite."

[tool.poe.tasks.build]
cmd = "uv build --no-create-gitignore"
help = "Build source and wheel distributions."

[tool.poe.tasks.docs]
cmd = "mkdocs build"
env = { NO_MKDOCS_2_WARNING = "1" }
help = "Build documentation."

[tool.poe.tasks.preview]
cmd = "mkdocs serve"
env = { NO_MKDOCS_2_WARNING = "1" }
help = "Start the documentation development server."

[tool.poe.tasks.check]
sequence = [
	"diff-check",
	"validate-pyproject",
	"lint",
	"typecheck",
	"test",
]
help = "Run all quality checks."

[tool.poe.tasks.verify]
sequence = [
	"check",
	"build",
	{ cmd = "twine check dist/*" },
	"docs",
]
help = "Run all quality checks and build artifacts."

[tool.poe.tasks.release-check]
sequence = [
	{ cmd = "git diff --quiet" },
	{ cmd = "git diff --cached --quiet" },
]
help = "Ensure the Git working tree and index are clean."

[tool.poe.tasks.release]
sequence = [
	"release-check",
	{ expr = "sys.exit(subprocess.run(['git', 'show-ref', '--verify', '--quiet', 'refs/tags/v${_version}']).returncode == 0)", imports = ["subprocess", "sys"] },
	{ expr = "sys.exit(f'## {_version}\\n' not in pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8'))", imports = ["sys", "pathlib"] },
	{ cmd = "uv version ${_version}" },
	{ cmd = "uv lock" },
	"verify",
	{ cmd = "git add pyproject.toml uv.lock" },
	{ cmd = 'git commit -m "Bump version to ${_version}."' },
	{ cmd = "git tag v${_version}" },
	{ cmd = "git push origin main v${_version}" },
]
args = [
	{ name = "_version", positional = true, help = "Target release version." },
]
help = "Prepare and publish a version tag to GitHub."

[build-system]
requires = ["hatchling>=1.27", "libcst>=1.1", "markdown-it-py>=3.0", "mdit-plain>=1.0.1"]
build-backend = "hatchling.build"

[dependency-groups]
quality = [
	"ruff>=0.16.6",
	"twine>=6.1.0",
	"ty>=0.0.85",
	"validate-pyproject>=0.25",
]
test = [
	"coverage>=7.6.1",
	"pytest>=8.3.5",
	"pytest-cov>=5.0.0",
	"pytest-metadata>=3.1.1",
	"pytest-randomly>=3.15.0",
	"pytest-sugar>=1.1.1",
	"pytest-timeout>=2.4.0",
	"pytest-xdist>=3.6.1",
]
documentation = [
	"accessible-pygments>=0.0.4",
	"justhtml>=0.1.0",
	"mkdocs-git-revision-date-localized-plugin>=1.4.7",
	"mkdocs-htmlproofer-plugin>=1.4.1",
	"mkdocs-macros-plugin>=1.5.0",
	"mkdocs-material>=9.7.7",
	"mkdocstrings[python]>=0.26.1",
	"tomli>=2.5.0",
]
dev = [
	{include-group = "quality"},
	{include-group = "test"},
	{include-group = "documentation"},
	"poethepoet>=0.30.0",
]
