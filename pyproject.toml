[project]
name = "pipeline-toolkit"
version = "0.2.1"
description = "A small functional pipeline toolkit for Python."
readme = "README.md"
authors = [
	{ name = "Hoàng Long", email = "hoanglongcodes@gmail.com" }
]
license = "MIT"
requires-python = ">=3.8"
dependencies = []

keywords = [
	"pipeline",
	"functional programming",
	"functional pipeline",
	"functional toolkit",
	"workflow",
	"async",
	"asynchronous",
	"threading",
	"utilities"
]

classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.8",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: 3.15",
	"Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/Hoang-Long2012/pipeline-toolkit"
Repository = "https://github.com/Hoang-Long2012/pipeline-toolkit"
Issues = "https://github.com/Hoang-Long2012/pipeline-toolkit/issues"
Changelog = "https://github.com/Hoang-Long2012/pipeline-toolkit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
