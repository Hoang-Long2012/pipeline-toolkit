site_name: Pipeline Toolkit
site_description: A small functional pipeline toolkit for Python
site_author: Hoàng Long
site_url: https://pipeline-toolkit.pages.dev
repo_url: https://github.com/Hoang-Long2012/pipeline-toolkit
repo_name: Hoang-Long2012/pipeline-toolkit
copyright: Copyright (C) 2026 Hoàng Long
use_directory_urls: false

theme:
  name: material
  language: en
  custom_dir: docs/overrides

  features:
    - navigation.instant
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
      timezone: Asia/Ho_Chi_Minh
      type: custom
      custom_format: "%Y-%m-%d %H:%M"
      exclude:
        - changelog.md
        - contributing.md
  - macros
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            docstring_section_style: list
            docstring_options:
              ignore_init_summary: true
            show_root_heading: true
            heading_level: 2
            show_symbol_type_heading: false
            show_symbol_type_toc: false
            show_signature_annotations: false
            members_order: __all__
            show_if_no_docstring: false
            show_category_heading: false
            group_by_category: false
            merge_init_into_class: true
            scoped_crossrefs: true
            show_source: false
            show_attribute_values: false
            show_root_full_path: false
            show_root_members_full_path: false
            show_object_full_path: false
            extensions:
              - docs/scripts/griffe_extension.py:PreferExportedAliases

hooks:
  - docs/scripts/mkdocs_hook.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/palette.js
  - javascripts/search.js

markdown_extensions:
  - nl2br
  - pymdownx.superfences:
      preserve_tabs: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

watch:
  - docs
  - mkdocs.yml
  - src/pipeline

nav:
  - Home: index.md
  - Changelog: changelog.md
  - Contributing: contributing.md
  - GitHub: https://github.com/Hoang-Long2012/pipeline-toolkit
  - PyPI: https://pypi.org/project/pipeline-toolkit

extra:
  version: ""
  material_version: ""
  deployment_date: ""
  deployment_time: ""
  analytics:
    provider: google
    property: G-ZZ1MDHKZ3H
