name: Pull request or push checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "src/pipeline/**"
      - "tests/**"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/pr.yml"
      - ".github/workflows/codeql.yml"
      - ".github/codeql/**"
      - ".github/scripts/**"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      code: ${{ steps.filter.outputs.code }}
      config: ${{ steps.filter.outputs.config }}
      docs: ${{ steps.filter.outputs.docs }}
      workflow: ${{ steps.filter.outputs.workflow }}
      run-all: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Check out source
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: main
          filters: |
            code:
              - "src/pipeline/**"
              - "tests/**"

            config:
              - "pyproject.toml"
              - "uv.lock"
              - ".python-version"

            docs:
              - "docs/**"
              - "mkdocs.yml"

            workflow:
              - ".github/workflows/pr.yml"
              - ".github/workflows/codeql.yml"
              - ".github/codeql/**"
              - ".github/scripts/**"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    if: |
      needs.changes.outputs.run-all == 'true' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  quality:
    name: Code quality and validation
    needs: changes
    if: |
      needs.changes.outputs.run-all == 'true' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.config == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=cr-at-eol diff --check origin/${{ github.base_ref }}...HEAD

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install project Python
        run: uv python install

      - name: Validate pyproject.toml
        run: uvx validate-pyproject pyproject.toml

      - name: Install dependencies with locked file
        run: uv sync --group quality

      - name: Run Ruff
        run: uv run ruff check

      - name: Run ty
        run: uv run ty check

  test-matrix:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: changes
    if: |
      needs.changes.outputs.run-all == 'true' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.config == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --group test

      - name: Run pytest
        run: uv run pytest --cov-report=xml

      - name: Generate coverage summary
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15' && hashFiles('coverage.xml') != '' }}
        run: uv run python .github/scripts/coverage_summary.py

      - name: Upload coverage to Codecov
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15' && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Check and build package
    needs: changes
    if: |
      needs.changes.outputs.run-all == 'true' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.config == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install project Python
        run: uv python install

      - name: Build distributions
        run: uv build

      - name: Test built wheel
        run: |
          uv venv --clear /tmp/test-env
          uv pip install --python /tmp/test-env/bin/python dist/*.whl
          /tmp/test-env/bin/python -c "import pipeline"
          rm -rf /tmp/test-env

      - name: Test built sdist
        run: |
          uv venv --clear /tmp/test-env
          uv pip install --python /tmp/test-env/bin/python dist/*.tar.gz
          /tmp/test-env/bin/python -c "import pipeline"
          rm -rf /tmp/test-env

      - name: Check distributions with Twine
        run: uvx twine check dist/*

  docs:
    name: Build documentation
    needs: changes
    if: |
      needs.changes.outputs.run-all == 'true' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.config == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install project Python
        run: uv python install

      - name: Install documentation dependencies
        run: uv sync --group documentation

      - name: Build documentation
        run: uv run mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

  ci:
    name: CI
    if: always()
    needs:
      - changes
      - dependency-review
      - analyze
      - quality
      - test-matrix
      - build
      - docs
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          DEPENDENCY_REVIEW: ${{ needs['dependency-review'].result }}
          ANALYZE: ${{ needs.analyze.result }}
          QUALITY: ${{ needs.quality.result }}
          TEST_MATRIX: ${{ needs['test-matrix'].result }}
          BUILD: ${{ needs.build.result }}
          DOCS: ${{ needs.docs.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          failed=0

          if [ "$CHANGES" != "success" ]; then
            echo "Change detection did not succeed."
            failed=1
          fi

          for result in "$ANALYZE" "$QUALITY" "$TEST_MATRIX" "$BUILD" "$DOCS"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job failed or was cancelled."
              failed=1
            fi
          done

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$DEPENDENCY_REVIEW" != "success" ]; then
            echo "Dependency review did not succeed."
            failed=1
          fi

          exit "$failed"
