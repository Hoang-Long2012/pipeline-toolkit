name: Pull request or push checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "src/pipeline/**"
      - "tests/**"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pr.yml"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  quality:
    name: Code quality and validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=cr-at-eol diff --check origin/${{ github.base_ref }}...HEAD

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install project Python
        run: uv python install

      - name: Validate pyproject.toml
        run: uvx validate-pyproject pyproject.toml

      - name: Install dependencies with locked file
        run: uv sync --group quality

      - name: Run Ruff
        run: uv run ruff check

      - name: Run ty
        run: uv run ty check

  test-matrix:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --group test

      - name: Run pytest
        run: uv run pytest --cov-report=xml

      - name: Generate coverage summary
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15' && hashFiles('coverage.xml') != '' }}
        run: uv run python .github/scripts/coverage_summary.py

      - name: Upload coverage to Codecov
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15' && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Check and build package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install project Python
        run: uv python install

      - name: Build distributions
        run: uv build

      - name: Test built wheel
        run: |
          uv venv --clear /tmp/test-env
          uv pip install --python /tmp/test-env/bin/python dist/*.whl
          /tmp/test-env/bin/python -c "import pipeline"
          rm -rf /tmp/test-env

      - name: Test built sdist
        run: |
          uv venv --clear /tmp/test-env
          uv pip install --python /tmp/test-env/bin/python dist/*.tar.gz
          /tmp/test-env/bin/python -c "import pipeline"
          rm -rf /tmp/test-env

      - name: Check distributions with Twine
        run: uvx twine check dist/*

  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install project Python
        run: uv python install

      - name: Install documentation dependencies
        run: uv sync --group documentation

      - name: Build documentation
        run: uv run mkdocs build --strict

  ci:
    name: CI
    if: always()
    needs:
      - dependency-review
      - quality
      - test-matrix
      - build
      - docs
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        env:
          DEPENDENCY_REVIEW: ${{ needs['dependency-review'].result }}
          QUALITY: ${{ needs.quality.result }}
          TEST_MATRIX: ${{ needs['test-matrix'].result }}
          BUILD: ${{ needs.build.result }}
          DOCS: ${{ needs.docs.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          failed=0

          for result in "$QUALITY" "$TEST_MATRIX" "$BUILD" "$DOCS"; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed."
              failed=1
            fi
          done

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$DEPENDENCY_REVIEW" != "success" ]; then
            echo "Dependency review did not succeed."
            failed=1
          fi

          exit "$failed"
