name: Publish package and create GitHub release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Ensure tag commit is on main
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "The tagged commit must be reachable from main." >&2
            exit 1
          fi

      - name: Check patch whitespace
        run: git -c core.whitespace=cr-at-eol diff --check "${GITHUB_REF}^{commit}^" "${GITHUB_REF}^{commit}"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Validate pyproject.toml
        run: uvx validate-pyproject pyproject.toml

      - name: Install project and development dependencies
        run: uv sync --group dev

      - name: Check tag matches package version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag in vX.Y.Z format, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          uv run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match project version {version}")
          PY

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run pytest
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Test built wheel
        run: |
          uv venv --clear /tmp/test-env
          uv pip install --python /tmp/test-env/bin/python dist/*.whl
          /tmp/test-env/bin/python -c "import pipeline"

      - name: Check distributions with Twine
        run: uvx twine check dist/*

      - name: Prepare release notes from changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          sections = re.split(r"(?m)^##\s+", changelog)
          for section in sections[1:]:
              heading, _, body = section.partition("\n")
              if heading.strip() == version:
                  notes = f"## {version}\n{body.rstrip()}\n"
                  Path("release-notes.md").write_text(notes, encoding="utf-8")
                  break
          else:
              raise SystemExit(f"No CHANGELOG.md section found for {tag}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish package to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pipeline-toolkit
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    name: Create GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download distributions and release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: release/dist/

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release/

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release/release-notes.md
            gh release upload "$RELEASE_TAG" release/dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file release/release-notes.md \
              release/dist/*
          fi
