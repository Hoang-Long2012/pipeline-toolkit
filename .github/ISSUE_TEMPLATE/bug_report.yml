name: Bug report
description: Report unexpected behavior in Pipeline-Toolkit.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Please check whether a similar issue already exists. Include enough detail
        for a contributor to reproduce the problem.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a small, complete example when possible.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Pipeline-Toolkit version
      placeholder: e.g. 0.5.2
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: e.g. 3.12.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Operating system or other details that may help diagnose the issue.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, logs, or screenshots.
    validations:
      required: false
